<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>红楼知识库 · 红学百科</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1>红楼知识库</h1>
      <p class="subtitle" id="site-subtitle">红楼梦结构化百科 · 人物 · 诗词 · 判词 · 情节 · 版本</p>
    </div>
    <div class="search-wrap">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="搜索人物、诗词、判词、情节、版本……"
        autocomplete="off"
      />
      <button id="search-clear" class="search-clear" title="清除" aria-label="清除搜索">×</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="分类导航"></nav>
    <main class="content" id="app" tabindex="-1"></main>
  </div>

  <footer class="site-footer">
    <span id="footer-note">样例数据 · 纯前端单页 · 数据可继续扩充</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
